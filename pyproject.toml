[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waveletec"
dynamic = ["version"]
description = "Wavelet-based Eddy Covariance"
readme = "README.md"
authors = [
    { name = "Pedro Henrique Coimbra", email = "pedro-henrique.herig-coimbra@inrae.fr" }
]
keywords = ["EC", "partitioning", "wavelet"]
license = { text = "EUPL-1.2" }
classifiers = [
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Development Status :: 4 - Beta",
    "Environment :: Other Environment",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Other/Nonlisted Topic",
]
requires-python = ">=3.8"
dependencies = [
    "pandas>=2.0.0",
    "matplotlib>=3.1.0",
    "numpy>=1.24",
    "PyWavelets>=1.4.0",
    "scipy>=1.10.0",
    "scikit-learn",
    "PyYAML",
    "xarray",
    "dask",
    "regorator",
]
[project.optional-dependencies]
cwt = ["pycwt"]
fcwt = ["pycwt", "fcwt"]

[project.scripts]
waveletEC-eddypro_run = "waveletec.main:eddypro_run"
waveletEC-partition = "waveletec.main:partition"
waveletEC-integrate = "waveletec.main:integrate"
waveletEC-exec = "waveletec.main:run"
waveletEC = "waveletec.main:main"

[project.urls]
Homepage = "https://github.com/pedrohenriquecoimbra/wavelet-ec"

[tool.setuptools]
packages.find = { where = ["."], include = ["waveletec*"], exclude = ["sample*", "deprecated*"], namespaces = false }
# exclude-package-data = { "waveletec" = ["sample*", "deprecated*"] }
# include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "waveletec.version.__version__" }
